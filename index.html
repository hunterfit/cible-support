<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<meta name="description" content="Lisez les textes sacrés dans leurs langues originales. Apprenez chaque soir.">
<title>Lectio Sacra — Lectures du soir</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231a1410' width='100' height='100'/%3E%3Ctext x='50' y='68' font-family='serif' font-size='60' fill='%23c9a961' text-anchor='middle'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Hebrew:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Ethiopic:wght@400;500&family=Noto+Sans+Syriac:wght@400&family=Noto+Sans+Coptic:wght@400&display=swap" rel="stylesheet">

<style>
:root {
  /* Palette parchemin / encre */
  --ink: #1a1410;
  --ink-soft: #2a221c;
  --parchment: #f4ead5;
  --parchment-dark: #e8dcbe;
  --parchment-deep: #d4c39a;
  --gold: #c9a961;
  --gold-deep: #a08240;
  --burgundy: #6b1e1e;
  --burgundy-soft: #8b3030;
  --sepia: #5c4a32;
  --shadow: rgba(26, 20, 16, 0.15);
  --shadow-deep: rgba(26, 20, 16, 0.35);

  --font-display: 'Cinzel', 'Cormorant Garamond', serif;
  --font-body: 'EB Garamond', Georgia, serif;
  --font-italic: 'Cormorant Garamond', serif;

  --safe-top: env(safe-area-inset-top, 0);
  --safe-bottom: env(safe-area-inset-bottom, 0);
}

[data-theme="dark"] {
  --ink: #f4ead5;
  --ink-soft: #d4c39a;
  --parchment: #1a1410;
  --parchment-dark: #241c15;
  --parchment-deep: #2e251c;
  --gold: #d4b878;
  --gold-deep: #c9a961;
  --burgundy: #c44545;
  --burgundy-soft: #a83838;
  --sepia: #b8a888;
  --shadow: rgba(0, 0, 0, 0.4);
  --shadow-deep: rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow-x: hidden;
}

body {
  font-family: var(--font-body);
  background: var(--parchment);
  color: var(--ink);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  position: relative;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  min-height: 100vh;
  background-image:
    radial-gradient(at 20% 0%, rgba(201, 169, 97, 0.08) 0%, transparent 50%),
    radial-gradient(at 80% 100%, rgba(107, 30, 30, 0.06) 0%, transparent 50%);
}

/* Texture papier subtile */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
  background-image:
    radial-gradient(circle at 25% 25%, transparent 0%, rgba(92, 74, 50, 0.03) 100%),
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(92, 74, 50, 0.015) 2px, rgba(92, 74, 50, 0.015) 4px);
  mix-blend-mode: multiply;
}

[data-theme="dark"] body::before {
  mix-blend-mode: screen;
  opacity: 0.2;
}

#app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 0 80px;
}

/* ============ TYPOGRAPHIE ============ */
h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: 0.04em;
}

.display-title {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.italic-quote {
  font-family: var(--font-italic);
  font-style: italic;
  font-weight: 400;
}

/* ============ HEADER ============ */
.app-header {
  padding: 28px 24px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(to bottom, var(--parchment) 70%, transparent);
  backdrop-filter: blur(8px);
}

.app-title {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.3em;
  font-weight: 500;
  color: var(--gold-deep);
  text-transform: uppercase;
}

.theme-toggle, .back-btn {
  background: none;
  border: none;
  color: var(--ink);
  cursor: pointer;
  padding: 8px;
  font-size: 18px;
  transition: opacity 0.2s;
  font-family: var(--font-body);
}

.theme-toggle:hover, .back-btn:hover { opacity: 0.6; }

.back-btn {
  font-size: 14px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-family: var(--font-display);
  color: var(--gold-deep);
}

/* ============ ÉCRAN D'ACCUEIL ============ */
.hero {
  text-align: center;
  padding: 40px 24px 32px;
  position: relative;
}

.hero::before, .hero::after {
  content: '✦';
  display: block;
  color: var(--gold);
  font-size: 14px;
  margin: 0 auto;
  opacity: 0.7;
}

.hero::before { margin-bottom: 24px; }
.hero::after { margin-top: 24px; }

.hero h1 {
  font-size: 42px;
  font-weight: 500;
  line-height: 1;
  margin-bottom: 12px;
  letter-spacing: 0.06em;
  color: var(--ink);
}

.hero .subtitle {
  font-family: var(--font-italic);
  font-style: italic;
  font-size: 17px;
  color: var(--sepia);
  letter-spacing: 0.02em;
  max-width: 320px;
  margin: 0 auto;
}

/* ============ DAILY READING ============ */
.daily-card {
  margin: 24px 20px;
  padding: 28px 24px;
  background: linear-gradient(135deg, var(--parchment-dark), var(--parchment-deep));
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 0 4px 20px var(--shadow);
  border: 1px solid var(--gold);
  border-color: rgba(201, 169, 97, 0.3);
}

.daily-card:active {
  transform: scale(0.98);
}

.daily-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle at top right, rgba(201, 169, 97, 0.25), transparent 70%);
}

.daily-label {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--burgundy);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.daily-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--gold), transparent);
}

.daily-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 6px;
  letter-spacing: 0.03em;
}

.daily-meta {
  font-family: var(--font-italic);
  font-style: italic;
  font-size: 14px;
  color: var(--sepia);
}

/* ============ STATS ============ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 16px 20px 32px;
}

.stat {
  text-align: center;
  padding: 16px 8px;
  background: rgba(201, 169, 97, 0.08);
  border-radius: 3px;
  border-top: 2px solid var(--gold);
}

.stat-number {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  color: var(--burgundy);
  display: block;
  line-height: 1;
}

.stat-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--sepia);
  margin-top: 6px;
  display: block;
  font-family: var(--font-display);
}

[data-theme="dark"] .stat-number { color: var(--gold); }

/* ============ SECTION HEADING ============ */
.section-heading {
  display: flex;
  align-items: center;
  margin: 32px 20px 20px;
  gap: 12px;
}

.section-heading h2 {
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--ink);
  font-weight: 500;
  white-space: nowrap;
}

.section-heading::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--gold), transparent);
}

/* ============ LANGUAGES GRID ============ */
.languages-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0 20px;
}

.lang-item {
  display: flex;
  align-items: center;
  padding: 18px 4px;
  border-bottom: 1px solid rgba(92, 74, 50, 0.15);
  cursor: pointer;
  transition: background 0.2s, padding 0.2s;
  background: none;
  border-left: none;
  border-right: none;
  border-top: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
}

.lang-item:active {
  background: rgba(201, 169, 97, 0.08);
  padding-left: 12px;
}

.lang-script {
  font-size: 28px;
  width: 56px;
  text-align: center;
  color: var(--burgundy);
  font-weight: 500;
  line-height: 1;
}

[data-theme="dark"] .lang-script { color: var(--gold); }

.lang-info {
  flex: 1;
  margin-left: 14px;
  min-width: 0;
}

.lang-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: var(--ink);
  margin-bottom: 4px;
}

.lang-detail {
  font-family: var(--font-italic);
  font-style: italic;
  font-size: 13px;
  color: var(--sepia);
  line-height: 1.3;
}

.lang-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 12px;
}

.progress-circle {
  width: 36px;
  height: 36px;
  position: relative;
}

.progress-circle svg {
  transform: rotate(-90deg);
}

.progress-circle .bg { stroke: rgba(92, 74, 50, 0.15); }
.progress-circle .fg { stroke: var(--gold); transition: stroke-dashoffset 0.5s ease; }

.progress-circle-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--burgundy);
}

[data-theme="dark"] .progress-circle-text { color: var(--gold); }

/* ============ PASSAGE LIST ============ */
.passages-list {
  margin: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.passage-item {
  display: flex;
  align-items: center;
  padding: 18px 18px;
  background: var(--parchment-dark);
  border-radius: 3px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 8px var(--shadow);
  border: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  border-left: 3px solid var(--gold);
}

.passage-item:active {
  transform: scale(0.98);
}

.passage-item.completed {
  border-left-color: var(--burgundy);
  opacity: 0.85;
}

.passage-number {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.passage-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 3px;
  letter-spacing: 0.02em;
}

.passage-meta {
  font-family: var(--font-italic);
  font-style: italic;
  font-size: 13px;
  color: var(--sepia);
}

.passage-info { flex: 1; min-width: 0; }

.check-mark {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--burgundy);
  color: var(--parchment);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  margin-left: 12px;
  flex-shrink: 0;
}

/* ============ READER ============ */
.reader {
  padding: 0 22px;
}

.reader-header {
  text-align: center;
  padding: 16px 0 32px;
  position: relative;
}

.reader-header::after {
  content: '';
  display: block;
  width: 80px;
  height: 1px;
  background: var(--gold);
  margin: 24px auto 0;
}

.reader-lang {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 12px;
}

.reader-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.2;
}

.reader-subtitle {
  font-family: var(--font-italic);
  font-style: italic;
  font-size: 15px;
  color: var(--sepia);
}

/* Verse blocks */
.verse {
  margin-bottom: 36px;
  padding-bottom: 32px;
  border-bottom: 1px solid rgba(92, 74, 50, 0.12);
}

.verse:last-of-type {
  border-bottom: none;
}

.verse-num {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--burgundy);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}

.verse-num::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(107, 30, 30, 0.2);
}

[data-theme="dark"] .verse-num { color: var(--gold); }
[data-theme="dark"] .verse-num::after { background: rgba(212, 184, 120, 0.25); }

.verse-original {
  font-size: 26px;
  line-height: 1.7;
  margin-bottom: 18px;
  color: var(--ink);
  font-weight: 500;
}

.verse-original.rtl {
  direction: rtl;
  text-align: right;
  font-family: 'Noto Serif Hebrew', 'Noto Naskh Arabic', serif;
  font-size: 28px;
}

.verse-original.arabic {
  font-family: 'Noto Naskh Arabic', serif;
  font-size: 30px;
  line-height: 2;
}

.verse-original.greek, .verse-original.coptic {
  font-family: 'EB Garamond', 'Noto Sans Coptic', serif;
}

.verse-original.devanagari {
  font-family: 'Noto Sans Devanagari', sans-serif;
  font-size: 22px;
  line-height: 1.8;
}

.verse-original.ethiopic {
  font-family: 'Noto Sans Ethiopic', sans-serif;
  font-size: 22px;
}

.verse-original.syriac {
  font-family: 'Noto Sans Syriac', serif;
  direction: rtl;
  text-align: right;
}

.verse-phonetic {
  font-family: var(--font-italic);
  font-style: italic;
  font-size: 16px;
  color: var(--sepia);
  margin-bottom: 14px;
  letter-spacing: 0.01em;
  line-height: 1.5;
  padding-left: 14px;
  border-left: 2px solid var(--gold);
}

.verse-translation {
  font-family: var(--font-body);
  font-size: 17px;
  color: var(--ink);
  line-height: 1.55;
  margin-bottom: 14px;
}

.verse-translation::before {
  content: '« ';
  color: var(--gold);
  font-weight: 600;
}
.verse-translation::after {
  content: ' »';
  color: var(--gold);
  font-weight: 600;
}

/* Keywords */
.keywords {
  margin-top: 18px;
  padding: 16px;
  background: rgba(201, 169, 97, 0.08);
  border-radius: 3px;
  border: 1px solid rgba(201, 169, 97, 0.25);
}

.keywords-title {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--burgundy);
  margin-bottom: 12px;
  font-weight: 600;
}

[data-theme="dark"] .keywords-title { color: var(--gold); }

.keyword {
  margin-bottom: 12px;
  font-size: 14px;
  line-height: 1.4;
}

.keyword:last-child { margin-bottom: 0; }

.keyword-word {
  font-weight: 600;
  color: var(--burgundy);
  font-size: 15px;
}

[data-theme="dark"] .keyword-word { color: var(--gold); }

.keyword-trans {
  font-family: var(--font-italic);
  font-style: italic;
  color: var(--sepia);
}

.keyword-meaning {
  display: block;
  color: var(--ink);
  margin-top: 2px;
}

/* ============ COMPLETE BUTTON ============ */
.complete-section {
  text-align: center;
  padding: 32px 0 16px;
}

.btn-primary {
  background: var(--burgundy);
  color: var(--parchment);
  border: none;
  padding: 14px 32px;
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.2s, transform 0.1s;
  font-weight: 500;
  box-shadow: 0 2px 8px rgba(107, 30, 30, 0.3);
}

[data-theme="dark"] .btn-primary {
  background: var(--gold);
  color: var(--parchment);
  box-shadow: 0 2px 8px rgba(201, 169, 97, 0.25);
}

.btn-primary:active { transform: scale(0.97); }

.btn-primary.completed {
  background: var(--sepia);
  cursor: default;
}

/* ============ TOAST ============ */
.toast {
  position: fixed;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: var(--parchment);
  padding: 14px 24px;
  border-radius: 2px;
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  z-index: 100;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 4px 20px var(--shadow-deep);
  border: 1px solid var(--gold);
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* ============ TRANSITIONS PAGE ============ */
.page {
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ EMPTY/LOADING ============ */
.empty {
  text-align: center;
  padding: 60px 24px;
  color: var(--sepia);
  font-family: var(--font-italic);
  font-style: italic;
}

/* ============ FOOTER ============ */
.app-footer {
  text-align: center;
  padding: 32px 24px 16px;
  color: var(--sepia);
  font-family: var(--font-italic);
  font-style: italic;
  font-size: 12px;
  opacity: 0.7;
}

.app-footer::before {
  content: '✦  ✦  ✦';
  display: block;
  letter-spacing: 0.5em;
  color: var(--gold);
  margin-bottom: 14px;
  font-style: normal;
  font-size: 8px;
}

/* ============ RESPONSIVE ============ */
@media (min-width: 480px) {
  body { background: var(--parchment-dark); }
  #app {
    background: var(--parchment);
    box-shadow: 0 0 40px var(--shadow);
    min-height: 100vh;
  }
}
</style>
</head>
<body>

<div id="app">
  <header class="app-header">
    <button id="back-btn" class="back-btn" style="visibility:hidden">‹ Retour</button>
    <span class="app-title">Lectio Sacra</span>
    <button id="theme-toggle" class="theme-toggle" aria-label="Changer de thème">◐</button>
  </header>

  <main id="content"></main>

  <footer class="app-footer">
    Lectio Sacra · Lectures sacrées de toutes nations
  </footer>
</div>

<div id="toast" class="toast"></div>

<script>
/* ==================================================================
   DONNÉES — 10 LANGUES SACRÉES & ANCIENNES
   ================================================================== */
const LANGUAGES = {
  hebrew: {
    name: "Hébreu biblique",
    detail: "Langue de la Torah · ~1200 av. J.-C.",
    script: "א",
    direction: "rtl",
    textClass: "rtl",
    description: "La langue de l'Ancien Testament et de la prière juive."
  },
  arabic: {
    name: "Arabe classique",
    detail: "Langue du Coran · VIIe siècle",
    script: "ع",
    direction: "rtl",
    textClass: "arabic",
    description: "Langue de la révélation coranique et de la poésie pré-islamique."
  },
  greek: {
    name: "Grec ancien (Koinè)",
    detail: "Nouveau Testament · Ier siècle",
    script: "Ω",
    direction: "ltr",
    textClass: "greek",
    description: "Langue des Évangiles et de la philosophie hellénistique."
  },
  latin: {
    name: "Latin classique",
    detail: "Vulgate & liturgie · Antiquité",
    script: "Æ",
    direction: "ltr",
    textClass: "",
    description: "Langue de Rome, de la Vulgate et de la liturgie chrétienne."
  },

/* ==================================================================
   ÉTAT DE L'APPLICATION
   ================================================================== */
const STORAGE_KEY = 'lectio-sacra-state';

const State = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      this.data = raw ? JSON.parse(raw) : { completed: {}, theme: 'light', firstVisit: Date.now() };
    } catch {
      this.data = { completed: {}, theme: 'light', firstVisit: Date.now() };
    }
    return this.data;
  },
  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
    } catch (e) {
      console.warn("Sauvegarde impossible :", e);
    }
  },
  isCompleted(passageId) {
    return !!this.data.completed[passageId];
  },
  markComplete(passageId) {
    this.data.completed[passageId] = Date.now();
    this.save();
  },
  unmark(passageId) {
    delete this.data.completed[passageId];
    this.save();
  },
  getLanguageProgress(langKey) {
    const passages = PASSAGES[langKey] || [];
    if (!passages.length) return 0;
    const done = passages.filter(p => this.isCompleted(p.id)).length;
    return Math.round((done / passages.length) * 100);
  },
  getTotalCompleted() {
    return Object.keys(this.data.completed).length;
  },
  getTotalKeywords() {
    let total = 0;
    Object.entries(PASSAGES).forEach(([_, passages]) => {
      passages.forEach(p => {
        if (this.isCompleted(p.id)) {
          p.verses.forEach(v => total += (v.keywords || []).length);
        }
      });
    });
    return total;
  },
  getStreak() {
    const dates = Object.values(this.data.completed)
      .map(t => new Date(t).toDateString());
    return new Set(dates).size;
  }
};

/* ==================================================================
   ROUTEUR / VUES
   ================================================================== */
const Router = {
  current: { view: 'home' },

  go(view, params = {}) {
    this.current = { view, ...params };
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

/* ==================================================================
   RENDU DES VUES
   ================================================================== */
function render() {
  const content = document.getElementById('content');
  const backBtn = document.getElementById('back-btn');

  let html = '';
  if (Router.current.view === 'home') {
    backBtn.style.visibility = 'hidden';
    html = renderHome();
  } else if (Router.current.view === 'language') {
    backBtn.style.visibility = 'visible';
    backBtn.onclick = () => Router.go('home');
    html = renderLanguage(Router.current.lang);
  } else if (Router.current.view === 'reader') {
    backBtn.style.visibility = 'visible';
    backBtn.onclick = () => Router.go('language', { lang: Router.current.lang });
    html = renderReader(Router.current.lang, Router.current.passageId);
  }

  content.innerHTML = `<div class="page">${html}</div>`;
  attachHandlers();
}

function renderHome() {
  const completed = State.getTotalCompleted();
  const totalPassages = Object.values(PASSAGES).reduce((s, p) => s + p.length, 0);
  const keywords = State.getTotalKeywords();
  const streak = State.getStreak();

  // Lecture du jour : pseudo-aléatoire stable basé sur la date
  const today = new Date();
  const seed = today.getFullYear() * 1000 + today.getMonth() * 50 + today.getDate();
  const allPassages = [];
  Object.entries(PASSAGES).forEach(([lang, passages]) => {
    passages.forEach(p => allPassages.push({ lang, passage: p }));
  });
  const daily = allPassages[seed % allPassages.length];

  let langsHtml = '';
  Object.entries(LANGUAGES).forEach(([key, lang]) => {
    const progress = State.getLanguageProgress(key);
    const passageCount = (PASSAGES[key] || []).length;
    const dash = 100;
    const offset = dash - (progress / 100) * dash;

    langsHtml += `
      <button class="lang-item" data-action="open-lang" data-lang="${key}">
        <span class="lang-script">${lang.script}</span>
        <span class="lang-info">
          <span class="lang-name">${lang.name}</span>
          <span class="lang-detail">${lang.detail} · ${passageCount} passage${passageCount > 1 ? 's' : ''}</span>
        </span>
        <span class="lang-progress">
          <span class="progress-circle">
            <svg width="36" height="36">
              <circle class="bg" cx="18" cy="18" r="15.9" fill="none" stroke-width="2.5"></circle>
              <circle class="fg" cx="18" cy="18" r="15.9" fill="none" stroke-width="2.5"
                stroke-dasharray="${dash}" stroke-dashoffset="${offset}" stroke-linecap="round"></circle>
            </svg>
            <span class="progress-circle-text">${progress}</span>
          </span>
        </span>
      </button>
    `;
  });

  return `
    <section class="hero">
      <h1>Lectio Sacra</h1>
      <p class="subtitle">Lectures sacrées, langues anciennes, sagesses du soir.</p>
    </section>

    <button class="daily-card" data-action="open-passage" data-lang="${daily.lang}" data-passage="${daily.passage.id}">
      <div class="daily-label">Lecture du soir</div>
      <div class="daily-title">${daily.passage.title}</div>
      <div class="daily-meta">${LANGUAGES[daily.lang].name} · ${daily.passage.reference}</div>
    </button>

    <div class="stats-row">
      <div class="stat">
        <span class="stat-number">${completed}</span>
        <span class="stat-label">Lus</span>
      </div>
      <div class="stat">
        <span class="stat-number">${totalPassages}</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-number">${keywords}</span>
        <span class="stat-label">Mots</span>
      </div>
    </div>

    <div class="section-heading"><h2>Bibliothèque</h2></div>
    <div class="languages-list">${langsHtml}</div>
  `;
}

function renderLanguage(langKey) {
  const lang = LANGUAGES[langKey];
  const passages = PASSAGES[langKey] || [];

  if (!lang) return '<div class="empty">Langue introuvable.</div>';

  const completed = passages.filter(p => State.isCompleted(p.id)).length;

  let listHtml = '';
  passages.forEach((p, i) => {
    const done = State.isCompleted(p.id);
    listHtml += `
      <button class="passage-item ${done ? 'completed' : ''}" data-action="open-passage" data-lang="${langKey}" data-passage="${p.id}">
        <span class="passage-info">
          <span class="passage-number">Passage ${String(i + 1).padStart(2, '0')}</span>
          <span class="passage-title">${p.title}</span>
          <span class="passage-meta">${p.reference}</span>
        </span>
        ${done ? '<span class="check-mark">✓</span>' : ''}
      </button>
    `;
  });

  return `
    <section class="reader-header">
      <div class="reader-lang">${lang.script}  ·  ${lang.detail.split('·')[0].trim()}</div>
      <h1 class="reader-title">${lang.name}</h1>
      <div class="reader-subtitle">${lang.description}</div>
    </section>

    <div class="stats-row" style="margin: 0 0 24px;">
      <div class="stat">
        <span class="stat-number">${completed}</span>
        <span class="stat-label">Lus</span>
      </div>
      <div class="stat">
        <span class="stat-number">${passages.length}</span>
        <span class="stat-label">Passages</span>
      </div>
      <div class="stat">
        <span class="stat-number">${State.getLanguageProgress(langKey)}%</span>
        <span class="stat-label">Progrès</span>
      </div>
    </div>

    <div class="section-heading"><h2>Passages</h2></div>
    <div class="passages-list">${listHtml}</div>
  `;
}

function renderReader(langKey, passageId) {
  const lang = LANGUAGES[langKey];
  const passage = (PASSAGES[langKey] || []).find(p => p.id === passageId);
  if (!passage || !lang) return '<div class="empty">Passage introuvable.</div>';

  const isCompleted = State.isCompleted(passageId);

  let versesHtml = '';
  passage.verses.forEach(v => {
    let kwHtml = '';
    if (v.keywords && v.keywords.length) {
      kwHtml = `
        <div class="keywords">
          <div class="keywords-title">Mots-clés à retenir</div>
          ${v.keywords.map(k => `
            <div class="keyword">
              <span class="keyword-word">${k.word}</span>
              <span class="keyword-trans"> (${k.trans})</span>
              <span class="keyword-meaning">${k.meaning}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    versesHtml += `
      <div class="verse">
        <div class="verse-num">Verset ${v.num}</div>
        <div class="verse-original ${lang.textClass}">${v.original}</div>
        <div class="verse-phonetic">${v.phonetic}</div>
        <div class="verse-translation">${v.translation}</div>
        ${kwHtml}
      </div>
    `;
  });

  return `
    <div class="reader">
      <section class="reader-header">
        <div class="reader-lang">${lang.name}</div>
        <h1 class="reader-title">${passage.title}</h1>
        <div class="reader-subtitle">${passage.reference}</div>
      </section>

      ${versesHtml}

      <div class="complete-section">
        <button class="btn-primary ${isCompleted ? 'completed' : ''}" data-action="toggle-complete" data-passage="${passageId}">
          ${isCompleted ? '✓  Lecture accomplie' : 'Marquer comme lu'}
        </button>
      </div>
    </div>
  `;
}

/* ==================================================================
   EVENTS
   ================================================================== */
function attachHandlers() {
  document.querySelectorAll('[data-action="open-lang"]').forEach(el => {
    el.onclick = () => Router.go('language', { lang: el.dataset.lang });
  });
  document.querySelectorAll('[data-action="open-passage"]').forEach(el => {
    el.onclick = () => Router.go('reader', { lang: el.dataset.lang, passageId: el.dataset.passage });
  });
  document.querySelectorAll('[data-action="toggle-complete"]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.passage;
      if (State.isCompleted(id)) {
        State.unmark(id);
        showToast('Lecture remise à plus tard');
      } else {
        State.markComplete(id);
        showToast('Lecture accomplie ✦');
      }
      render();
    };
  });
}

/* ==================================================================
   THEME TOGGLE
   ================================================================== */
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  State.data.theme = theme;
  State.save();
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1a1410' : '#f4ead5';
}

document.getElementById('theme-toggle').onclick = () => {
  const next = (State.data.theme === 'dark') ? 'light' : 'dark';
  applyTheme(next);
};

/* ==================================================================
   TOAST
   ================================================================== */
let toastTimer;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ==================================================================
   PWA — Service Worker
   ================================================================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* ==================================================================
   INITIALISATION
   ================================================================== */
State.load();
applyTheme(State.data.theme || 'light');
render();
</script>
